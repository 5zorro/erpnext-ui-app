<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>History</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a252f; color: #cbd5e1; font-family: system-ui, "Segoe UI", Roboto, sans-serif; overflow-y: auto; }
    .head {
      padding: 10px 12px 6px; font-size: 10px; letter-spacing: .6px; text-transform: uppercase;
      color: #6b8299; border-bottom: 1px solid #2c3e50;
    }
    .head-drafts, .head-calc { margin-top: 8px; }
    ul { list-style: none; margin: 0; padding: 6px; }
    li button {
      width: 100%; text-align: left; border: none; background: transparent; color: #cbd5e1;
      padding: 8px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    li button:hover { background: #2c3e50; color: #fff; }
    li button.draft-label { font-size: 11px; line-height: 1.35; white-space: normal; }
    li button .hist-detail { margin-left: 0.35em; font-weight: 400; }
    li button .hist-detail.muted { color: #6b8299; }
    li button:hover .hist-detail.muted { color: #9fb3c8; }
    li.hist-row { display: flex; gap: 2px; align-items: stretch; }
    li.hist-row .hist-nav { flex: 1; min-width: 0; }
    li button.hist-copy-ref {
      flex: 0 0 auto; width: 34px; padding: 0;
      font-size: 14px; line-height: 1; color: #9fb3c8;
    }
    li button.hist-copy-ref:hover { background: #334155; color: #fff; }
    li button.hist-copy-ref.is-copied { color: #86efac; }
    .ui-ico svg { display: block; }
    li button.hist-setup { color: #9fb3c8; }
    li button.hist-peek-parent { font-weight: 600; color: #e2e8f0; }
    li button.hist-peek-child { padding-left: 18px; }
    .hist-tree-guide {
      display: inline-block; min-width: 2.1em; margin-right: 0.15em;
      color: #6b8299; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 11px; font-weight: 400;
    }
    li button:hover .hist-tree-guide { color: #9fb3c8; }
    .empty { padding: 14px 12px; font-size: 12px; color: #6b8299; line-height: 1.4; }
    .older-toggle {
      display: block; width: calc(100% - 12px); margin: 4px 6px 0; text-align: left;
      border: none; background: #243140; color: #9fb3c8; padding: 8px 10px; border-radius: 6px;
      font-size: 11px; cursor: pointer; letter-spacing: .3px;
    }
    .older-toggle:hover { background: #2c3e50; color: #fff; }
    .older-toggle[hidden] { display: none; }
    .older-panel { border-top: 1px solid #2c3e50; margin-top: 4px; }
    .older-panel[hidden] { display: none; }
    #sec-drafts[hidden], #sec-calc[hidden] { display: none; }
    .calc-open-btn {
      display: block; width: calc(100% - 12px); margin: 6px 6px 10px; text-align: left;
      border: 1px solid #3b4d63; background: #243140; color: #e2e8f0;
      padding: 10px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
      letter-spacing: .2px;
    }
    .calc-open-btn:hover { background: #2c3e50; border-color: #526780; }
    .calc-open-btn .calc-open-sub {
      display: block; margin-top: 4px; font-size: 10px; color: #6b8299; letter-spacing: .3px;
    }
  </style>
</head>
<body>
  <div class="head">Recent</div>
  <div class="empty" id="empty">Open Desk and visit forms — each doctype appears once here.</div>
  <ul id="list-recent" hidden></ul>
  <button type="button" class="older-toggle" id="older-toggle" hidden aria-expanded="false">▼ Older</button>
  <div class="older-panel" id="older-panel" hidden>
    <ul id="list-older"></ul>
  </div>

  <div id="sec-drafts" hidden>
    <div class="head head-drafts">Drafts</div>
    <ul id="list-drafts"></ul>
    <button type="button" class="older-toggle" id="drafts-older-toggle" hidden aria-expanded="false">▼ Older drafts</button>
    <div class="older-panel" id="drafts-older-panel" hidden>
      <ul id="list-drafts-older"></ul>
    </div>
  </div>

  <div id="sec-calc">
    <div class="head head-calc">Calculator</div>
    <button type="button" class="calc-open-btn" id="calc-open" data-testid="calc-history-open">
      Calculator history
      <span class="calc-open-sub" id="calc-open-sub">No calculations yet</span>
    </button>
  </div>

  <script type="module">
    import { splitHistory } from "../src/history.js";
    import { splitShelvedDrafts } from "../src/shelved-drafts.js";
    import { flyoutRowCopyRef } from "../src/history-copy-ref.js";
    import { copyTotalIconHtml, uiIconHtml } from "../src/ui-icons.js";

    const listRecent = document.getElementById("list-recent");
    const listOlder = document.getElementById("list-older");
    const emptyEl = document.getElementById("empty");
    const olderToggle = document.getElementById("older-toggle");
    const olderPanel = document.getElementById("older-panel");
    const secDrafts = document.getElementById("sec-drafts");
    const listDrafts = document.getElementById("list-drafts");
    const listDraftsOlder = document.getElementById("list-drafts-older");
    const draftsOlderToggle = document.getElementById("drafts-older-toggle");
    const draftsOlderPanel = document.getElementById("drafts-older-panel");
    const calcOpenBtn = document.getElementById("calc-open");
    const calcOpenSub = document.getElementById("calc-open-sub");
    const api = window.erpHist;
    let olderOpen = false;
    let draftsOlderOpen = false;
    let calcCount = 0;

    function fillList(ul, rows, opts = {}) {
      ul.innerHTML = "";
      rows.forEach((h) => {
        const li = document.createElement("li");
        const copyRef = flyoutRowCopyRef(h, { draft: !!opts.draft });
        if (copyRef) li.className = "hist-row";

        const b = document.createElement("button");
        b.type = "button";
        b.className = copyRef ? "hist-nav" : "";
        b.title = h.route || "";
        if (opts.draft) b.classList.add("draft-label");

        const primary = h.label || h.dt || h.name || "";
        if (!opts.draft && h.treeDepth === 1) {
          b.classList.add("hist-peek-child");
          b.dataset.testid = "hist-peek-child";
          const guide = document.createElement("span");
          guide.className = "hist-tree-guide";
          guide.setAttribute("aria-hidden", "true");
          guide.textContent = "L→ ";
          b.appendChild(guide);
          const parentName = h.treeParentLabel || "document";
          b.setAttribute("aria-label", `${primary}, peek under ${parentName}`);
        } else if (h.treeRole === "parent") {
          b.classList.add("hist-peek-parent");
          b.dataset.testid = "hist-peek-parent";
        }
        b.appendChild(document.createTextNode(primary));
        if (h.kind === "setup") b.classList.add("hist-setup");
        const detail = h.detail != null ? String(h.detail).trim() : "";
        if (detail) {
          const span = document.createElement("span");
          span.className = "hist-detail" + (h.detailMuted ? " muted" : "");
          span.textContent = detail;
          b.appendChild(span);
        }

        b.onclick = () => {
          if (api && api.navDebug) api.navDebug("hist-click", h.route || "(empty route)");
          if (api) api.openErp(h.route);
        };
        li.appendChild(b);

        if (copyRef) {
          const copyBtn = document.createElement("button");
          copyBtn.type = "button";
          copyBtn.className = "hist-copy-ref";
          copyBtn.dataset.testid = "hist-copy-ref";
          copyBtn.title = `Copy ref: ${copyRef}`;
          copyBtn.setAttribute("aria-label", `Copy ref ${copyRef}`);
          copyBtn.innerHTML = copyTotalIconHtml();
          copyBtn.onclick = (ev) => {
            ev.stopPropagation();
            if (api && api.navDebug) api.navDebug("hist-copy-ref", copyRef);
            const iconHtml = copyTotalIconHtml();
            const done = (ok) => {
              if (!ok) return;
              copyBtn.classList.add("is-copied");
              copyBtn.innerHTML = uiIconHtml("check", { size: 14 });
              setTimeout(() => {
                copyBtn.classList.remove("is-copied");
                copyBtn.innerHTML = iconHtml;
              }, 1200);
            };
            if (api && api.copyHistoryRef) {
              api.copyHistoryRef(copyRef).then((r) => done(r && r.ok)).catch(() => {});
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(copyRef).then(() => done(true)).catch(() => {});
            }
          };
          li.appendChild(copyBtn);
        }

        ul.appendChild(li);
      });
    }

    function setOlderOpen(open) {
      olderOpen = open;
      olderPanel.hidden = !open;
      olderToggle.setAttribute("aria-expanded", open ? "true" : "false");
      const n = listOlder.querySelectorAll("li").length;
      olderToggle.textContent = open ? `▲ Older (${n})` : `▼ Older (${n})`;
    }

    function setDraftsOlderOpen(open) {
      draftsOlderOpen = open;
      draftsOlderPanel.hidden = !open;
      draftsOlderToggle.setAttribute("aria-expanded", open ? "true" : "false");
      const n = listDraftsOlder.querySelectorAll("li").length;
      draftsOlderToggle.textContent = open ? `▲ Older drafts (${n})` : `▼ Older drafts (${n})`;
    }

    function updateCalcButton() {
      calcOpenSub.textContent =
        calcCount === 0
          ? "No calculations yet"
          : calcCount === 1
            ? "1 calculation · open panel"
            : `${calcCount} calculations · open panel`;
    }

    olderToggle.onclick = () => setOlderOpen(!olderOpen);
    draftsOlderToggle.onclick = () => setDraftsOlderOpen(!draftsOlderOpen);
    calcOpenBtn.onclick = () => {
      if (!api || !api.openCalcHistory) return;
      const r = calcOpenBtn.getBoundingClientRect();
      api.openCalcHistory({
        x: r.right,
        y: r.top,
        width: r.width,
        height: r.height,
      });
    };

    function render(payload) {
      const rows = Array.isArray(payload)
        ? payload
        : Array.isArray(payload && payload.items)
          ? payload.items
          : [];
      const shelved = Array.isArray(payload) ? [] : (payload && payload.shelved) || [];
      const calcRows = Array.isArray(payload) ? [] : (payload && payload.calcHistory) || [];
      calcCount = calcRows.length;
      updateCalcButton();
      const { recent, older } = splitHistory(rows);

      if (!rows.length) {
        emptyEl.hidden = false;
        listRecent.hidden = true;
        olderToggle.hidden = true;
        olderPanel.hidden = true;
      } else {
        emptyEl.hidden = true;
        listRecent.hidden = false;
        fillList(listRecent, recent);
        if (older.length) {
          fillList(listOlder, older);
          olderToggle.hidden = false;
          setOlderOpen(olderOpen);
        } else {
          olderToggle.hidden = true;
          olderPanel.hidden = true;
          olderOpen = false;
        }
      }

      if (!shelved.length) {
        secDrafts.hidden = true;
      } else {
        secDrafts.hidden = false;
        const { visible, older: draftOlder } = splitShelvedDrafts(shelved);
        fillList(listDrafts, visible, { draft: true });
        if (draftOlder.length) {
          fillList(listDraftsOlder, draftOlder, { draft: true });
          draftsOlderToggle.hidden = false;
          setDraftsOlderOpen(draftsOlderOpen);
        } else {
          draftsOlderToggle.hidden = true;
          draftsOlderPanel.hidden = true;
          draftsOlderOpen = false;
        }
      }
    }

    if (api) api.onHistory(render);
    render({ items: [], shelved: [], calcHistory: [] });
  </script>
</body>
</html>
