<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Payment Entry</title>
  <link rel="stylesheet" href="doc-wash.css" />
  <link rel="stylesheet" href="doc-skin.css" />
  <link rel="stylesheet" href="check-doc.css" />
  <style>
    html, body {
      margin: 0; background: var(--doc-page-canvas, #eef2f5); color: #1f2d3d;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      height: 52px; box-sizing: border-box; padding: 0 20px; background: #fff;
      border-bottom: 1px solid #d6dee6;
    }
    h1 { font-size: 15px; margin: 0; color: #2c3e50; font-weight: 600; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 20px 40px; }
    #load-error {
      margin: 0 0 16px; padding: 10px 14px; background: #fef2f2; border: 1px solid #fca5a5;
      border-radius: 8px; color: #991b1b; font-size: 12px;
    }
    #load-error[hidden] { display: none; }
    #not-pay {
      margin: 0 0 16px; padding: 14px; background: #fffbeb; border: 1px solid #fcd34d;
      border-radius: 8px; color: #92400e; font-size: 13px; line-height: 1.5;
    }
    #not-pay[hidden] { display: none; }
    .view-link { color: #0072b2; text-decoration: none; font-size: 12px; }
    .view-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1 data-testid="payment-doc-title">Payment Entry</h1>
    <a href="#" class="view-link" id="open-vanilla" data-testid="payment-doc-open-vanilla">Open in Vanilla →</a>
  </header>
  <main>
    <div id="load-error" hidden data-testid="payment-doc-error"></div>
    <div id="not-pay" hidden data-testid="payment-doc-not-pay">
      This is a Receive-type Payment Entry. The Doc skin for receiving payments (AR) isn't built
      yet — open it in Vanilla instead.
    </div>
    <div class="check-doc" id="check-doc" data-testid="check-doc" hidden>
  <div class="check-doc-badge" data-testid="check-doc-badge">Preview — not yet saved</div>
  <div class="check-doc-face">
    <div class="check-doc-row check-doc-payee-row">
      <span class="check-doc-label">Pay to the order of</span>
      <span class="check-doc-payee" data-testid="check-doc-payee"></span>
      <!-- Blank mode only: the payee and amount become inputs, because on a new check the clerk
           supplies them. Every other mount gets them from a batch or a saved document. -->
      <input type="text" id="check-doc-payee-input" class="check-doc-input check-doc-payee-input"
        data-testid="check-doc-payee-input" placeholder="Search Supplier…" autocomplete="off" hidden />
    </div>
    <div class="check-doc-row check-doc-amount-row">
      <span class="check-doc-amount-box" data-testid="check-doc-amount"></span>
      <input type="number" step="0.01" min="0" id="check-doc-amount-input"
        class="check-doc-input check-doc-amount-input" data-testid="check-doc-amount-input"
        placeholder="0.00" autocomplete="off" hidden />
    </div>
    <!-- Written-amount line, check no. and bank block: ERPNext computes/fetches all of these on
         save, so an existing document prints them. A proposal has none yet, so each row stays
         `hidden` until paintCheckDoc is given a value — "rendered only when non-empty". -->
    <div class="check-doc-row check-doc-words-row" data-testid="check-doc-words-row" hidden>
      <span class="check-doc-words" data-testid="check-doc-words"></span>
    </div>
    <div class="check-doc-row check-doc-meta-row">
      <div class="check-doc-field">
        <span class="check-doc-label">Date</span>
        <span class="check-doc-value" data-testid="check-doc-date"></span>
      </div>
      <div class="check-doc-field" data-testid="check-doc-no-field" hidden>
        <span class="check-doc-label">Check no.</span>
        <span class="check-doc-value" data-testid="check-doc-no"></span>
      </div>
    </div>
    <div class="check-doc-row check-doc-bank-row" data-testid="check-doc-bank-row" hidden>
      <span class="check-doc-label">Drawn on</span>
      <span class="check-doc-value" data-testid="check-doc-bank"></span>
    </div>
    <div class="check-doc-row check-doc-memo-row">
      <span class="check-doc-label">Memo</span>
      <span class="check-doc-value" data-testid="check-doc-memo"></span>
    </div>
  </div>
  <div class="check-doc-stub" data-testid="check-doc-stub">
    <div class="check-doc-stub-head">Remittance</div>
    <div class="check-doc-stub-rows" data-testid="check-doc-stub-rows"></div>
    <div class="check-doc-stub-total" data-testid="check-doc-stub-total"></div>
  </div>
  <div class="check-doc-taxes" data-testid="check-doc-taxes" hidden></div>
  <div class="check-doc-deductions" data-testid="check-doc-deductions" hidden></div>
  <div class="check-doc-write" data-testid="check-doc-write">
    <div class="check-doc-row check-doc-write-row">
      <div class="check-doc-field">
        <label class="check-doc-label" for="check-doc-mop">Mode of Payment</label>
        <input type="text" id="check-doc-mop" class="check-doc-input" data-testid="check-doc-mop"
          placeholder="Search Mode of Payment…" autocomplete="off" />
      </div>
      <div class="check-doc-field">
        <label class="check-doc-label" for="check-doc-cash-account">Pay from account</label>
        <input type="text" id="check-doc-cash-account" class="check-doc-input" data-testid="check-doc-cash-account"
          placeholder="Search Account…" autocomplete="off" />
      </div>
    </div>
    <div class="check-doc-row check-doc-write-row">
      <div class="check-doc-field">
        <label class="check-doc-label" for="check-doc-reference-no">Check no. / Reference</label>
        <input type="text" id="check-doc-reference-no" class="check-doc-input" data-testid="check-doc-reference-no"
          placeholder="e.g. 10231" autocomplete="off" />
      </div>
      <div class="check-doc-field">
        <label class="check-doc-label" for="check-doc-memo-input">Memo</label>
        <input type="text" id="check-doc-memo-input" class="check-doc-input" data-testid="check-doc-memo-input"
          placeholder="What this payment is for" autocomplete="off" />
      </div>
    </div>
    <div class="check-doc-write-actions" data-testid="check-doc-write-actions">
      <span class="check-doc-write-status" data-testid="check-doc-write-status"></span>
      <button type="button" class="check-doc-submit" id="check-doc-submit" data-testid="check-doc-submit">Create &amp; submit Payment Entry</button>
      <button type="button" class="check-doc-submit" id="check-doc-save" data-testid="check-doc-save" hidden>Save changes</button>
      <button type="button" class="check-doc-submit" id="check-doc-create" data-testid="check-doc-create" hidden>Create draft payment</button>
    </div>
  </div>
</div>
  </main>

  <script type="module">
    import {
      paintCheckDoc,
      mountCheckDocEdit,
      setCheckDocDocument,
    } from "../src/check-doc-mount.js";
    import { buildCheckDocViewModelFromPaymentEntry } from "../src/check-doc-view.js";

    const api = window.erpPaymentDoc;
    const checkDocEl = document.getElementById("check-doc");
    const errorEl = document.getElementById("load-error");
    const notPayEl = document.getElementById("not-pay");
    const openVanillaLink = document.getElementById("open-vanilla");

    function showError(message) {
      errorEl.hidden = !message;
      errorEl.textContent = message || "";
    }

    /** @param {string} [statusText] shown after the repaint, which clears the status line */
    async function init(statusText) {
      const params = new URLSearchParams(location.search);
      const name = params.get("name") || "";

      openVanillaLink.onclick = (ev) => {
        ev.preventDefault();
        if (api && api.openErp) {
          api.openErp(name ? `/app/payment-entry/${encodeURIComponent(name)}` : "/app/payment-entry");
        }
      };

      if (!name) {
        showError("No Payment Entry specified.");
        return;
      }
      if (!api || !api.getPaymentEntry) {
        showError("Shell bridge unavailable — cannot load this Payment Entry.");
        return;
      }
      const result = await api.getPaymentEntry(name).catch((e) => ({ ok: false, reason: String(e) }));
      if (!result || !result.ok || !result.doc) {
        showError((result && result.reason) || "Could not load this Payment Entry.");
        return;
      }
      const doc = result.doc;
      if (doc.payment_type !== "Pay") {
        notPayEl.hidden = false;
        return;
      }
      const vm = buildCheckDocViewModelFromPaymentEntry(doc);
      // A Draft is a form you can work in; a Submitted/Cancelled one is read-only because
      // ERPNext says so, not because this skin prefers documents to feel read-only
      // (5zorro 2026-09-08). The document's own docstatus is the only input to that choice.
      setCheckDocDocument(doc.name || name);
      paintCheckDoc(checkDocEl, vm, {
        mode: vm.isDraft ? "edit" : "view",
        badgeText: `${vm.status} Payment Entry`,
      });
      // paintCheckDoc clears the status line, so a post-save confirmation has to land after it.
      if (statusText) {
        const statusEl = checkDocEl.querySelector('[data-testid="check-doc-write-status"]');
        if (statusEl) statusEl.textContent = statusText;
      }
    }

    mountCheckDocEdit(checkDocEl, {
      api: api || {},
      linkMounted: new WeakMap(),
      onDirty: (dirty) => {
        if (api && api.setDirty) api.setDirty(dirty);
      },
      // Repaint from ERP truth, not from what we just typed — a validation hook or a fetch-from
      // may have changed more than the four fields we sent.
      onSaved: () => init("Saved."),
    });

    init();
  </script>
</body>
</html>
