<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Connection details</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #1a252f; color: #e2e8f0;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif; font-size: 12px; line-height: 1.45;
      overflow: hidden;
    }
    .wrap { padding: 12px 14px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; }
    h3 {
      margin: 0 0 8px; font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: #9fb3c8;
    }
    pre {
      margin: 0 0 10px; flex: 1; overflow: auto; white-space: pre-wrap; word-break: break-word;
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: #cbd5e1;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .btn {
      color: #fff; background: #34495e; border: none; padding: 7px 12px; font-size: 12px;
      cursor: pointer; border-radius: 6px;
    }
    .btn:hover { background: #3d566e; }
    .btn.ghost { background: transparent; color: #9fb3c8; }
    .btn.ghost:hover { background: #243140; color: #fff; }
    .btn.primary { background: #1f6feb; }
    .btn.primary:hover { background: #388bfd; }
    .btn.loud {
      background: #b45309; color: #fff; font-weight: 700; letter-spacing: .2px;
    }
    .btn.loud:hover { background: #c2410c; color: #fff; }
    .btn.loud.focus { background: #0369a1; }
    .btn.loud.focus:hover { background: #0284c7; }
    .btn[hidden] { display: none !important; }
    .hint { color: #6b8299; font-size: 11px; margin-top: 4px; }
    .remediation-hint { color: #9fb3c8; font-size: 11px; margin: 0 0 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h3>Connection details</h3>
    <pre id="body">Loading…</pre>
    <p class="remediation-hint" id="remediation-hint" hidden></p>
    <div class="row" id="remediation-row">
      <button type="button" class="btn primary" id="btn-autofix" hidden>Start ERPNext</button>
      <button type="button" class="btn" id="btn-notify" hidden>Notify IT</button>
      <button type="button" class="btn" id="btn-finish-autofix" hidden>Finish autofix setup…</button>
      <button type="button" class="btn" id="btn-setup" hidden>Set up how IT wants to handle this…</button>
    </div>
    <div class="row">
      <button type="button" class="btn loud" id="btn-nav-issue" data-testid="btn-nav-issue"
        title="Log a navigation issue with a note (Ctrl+Shift+M). Click as soon as something feels wrong — snapshot freezes now.">Nav issue</button>
      <button type="button" class="btn loud focus" id="btn-focus-issue" data-testid="btn-focus-issue"
        title="Log a keyboard/focus issue with a note (Ctrl+Shift+F). Includes rolling focus trail.">Focus issue</button>
      <button type="button" class="btn" id="btn-copy">Copy all</button>
      <button type="button" class="btn ghost" id="btn-close">Close</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
  <script>
    const api = window.erpDiagnose;
    const body = document.getElementById("body");
    const hint = document.getElementById("hint");
    const remHint = document.getElementById("remediation-hint");
    const btnSetup = document.getElementById("btn-setup");
    const btnNotify = document.getElementById("btn-notify");
    const btnAutofix = document.getElementById("btn-autofix");
    const btnFinish = document.getElementById("btn-finish-autofix");

    function apply(snap) {
      body.textContent = (snap && snap.copyText) || "No details yet.";
      hint.textContent = (snap && snap.updateStub) || "";
      const r = (snap && snap.remediation) || {};
      remHint.hidden = !r.hint;
      remHint.textContent = r.hint || "";
      btnSetup.hidden = !r.showSetup;
      btnSetup.textContent = r.setupLabel || "Set up how IT wants to handle this…";
      btnNotify.hidden = !r.showNotify;
      btnNotify.textContent = r.notifyLabel || "Notify IT";
      btnAutofix.hidden = !r.showAutofix;
      btnAutofix.textContent = r.autofixLabel || "Start ERPNext";
      btnFinish.hidden = !r.showFinishAutofixSetup;
      btnFinish.textContent = r.finishAutofixLabel || "Finish autofix setup…";
    }

    async function afterAction(res) {
      if (res && res.message) remHint.textContent = res.message;
      if (api && api.refresh) {
        const snap = await api.refresh();
        if (snap) apply(snap);
      }
    }

    document.getElementById("btn-nav-issue").onclick = () => {
      if (api && api.openNavIncident) api.openNavIncident();
    };
    document.getElementById("btn-focus-issue").onclick = () => {
      if (api && api.openFocusIncident) api.openFocusIncident();
    };
    document.getElementById("btn-copy").onclick = () => api && api.copy();
    document.getElementById("btn-close").onclick = () => api && api.close();
    btnSetup.onclick = async () => {
      if (!api || !api.setupRemediation) return;
      afterAction(await api.setupRemediation());
    };
    btnFinish.onclick = () => btnSetup.onclick();
    btnNotify.onclick = async () => {
      if (!api || !api.notifyIt) return;
      afterAction(await api.notifyIt());
    };
    btnAutofix.onclick = async () => {
      if (!api || !api.runAutofix) return;
      afterAction(await api.runAutofix());
    };
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "M" || e.key === "m")) {
        e.preventDefault();
        if (api && api.openNavIncident) api.openNavIncident();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "F" || e.key === "f")) {
        e.preventDefault();
        if (api && api.openFocusIncident) api.openFocusIncident();
        return;
      }
      if (e.key === "Escape" && api) api.close();
    });

    if (api) {
      api.onData(apply);
      api.ready();
    }
  </script>
</body>
</html>
