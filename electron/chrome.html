<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; height: 46px; overflow: hidden; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #2c3e50; }
    .bar { display: flex; align-items: center; height: 46px; padding: 0 8px; gap: 6px; }
    .brand { color: #fff; font-weight: 700; font-size: 14px; padding-left: 6px; margin-right: 4px; flex-shrink: 0; }
    .ver { color: #6b8299; font-size: 10px; margin-right: 4px; flex-shrink: 0; }
    .btn { color: #cbd5e1; background: transparent; border: none; padding: 7px 10px; font-size: 13px; cursor: pointer; border-radius: 6px; flex-shrink: 0; }
    .btn:hover { background: #34495e; color: #fff; }
    .btn.loud[hidden] { display: none; }
    .btn.loud {
      background: #b45309; color: #fff; font-weight: 700; letter-spacing: .2px;
    }
    .btn.loud:hover { background: #c2410c; color: #fff; }
    .lbl { color: #6b8299; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-left: 4px; flex-shrink: 0; }
    .seg { display: flex; background: #1f2d3d; border-radius: 8px; padding: 2px; flex-shrink: 0; }
    .seg .opt { color: #9fb3c8; background: transparent; border: none; padding: 6px 14px; font-size: 13px; cursor: pointer; border-radius: 6px; }
    .seg .opt.active { background: #f7fafc; color: #2c3e50; font-weight: 600; }
    .seg .opt:disabled { opacity: 0.4; cursor: not-allowed; }
    .seg .opt[hidden] { display: none; }
    .lbl[hidden] { display: none; }
    .peek-hint {
      color: #f0e6d2; font-size: 12px; padding: 4px 10px; border-radius: 6px;
      background: #3d4f63; flex-shrink: 0; letter-spacing: .2px;
    }
    .peek-hint[hidden] { display: none; }
    .spacer { flex: 1; min-width: 8px; }
    .health {
      display: flex; align-items: center; gap: 6px; color: #9fb3c8; font-size: 12px; padding: 0 8px;
      cursor: pointer; border: none; background: transparent; border-radius: 6px; flex-shrink: 0;
    }
    .health:hover { background: #34495e; }
    .health .dot { width: 9px; height: 9px; border-radius: 50%; background: #7f8c8d; }
    .health.ok .dot { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
    .health.bad .dot { background: #e74c3c; box-shadow: 0 0 6px #e74c3c; }
    .health.ok { color: #d5f5e3; }
    .health.bad { color: #f9d4cf; }
    .src { color: #8fa6bd; font-size: 12px; }
    .dbg { color: #a8c0d4; font-size: 12px; }
  </style>
</head>
<body>
  <div class="bar" role="navigation" aria-label="Shell toolbar">
    <span class="brand">Books</span>
    <span class="ver" id="app-ver" title="Shell updates: ask IT"></span>
    <button type="button" class="btn" id="btn-home" data-testid="btn-home" title="Doc Workflow Home (tiles)">Home</button>
    <span class="lbl" id="lens-label">View this page as:</span>
    <div class="seg" role="tablist">
      <button type="button" class="opt" id="lens-vanilla" data-testid="lens-vanilla" role="tab">Vanilla</button>
      <button type="button" class="opt" id="lens-simplified" data-testid="lens-simplified" role="tab" title="Simplified skin — Vanilla + field assumptions (hide / pre-fill common fields)" hidden>Simplified</button>
      <button type="button" class="opt active" id="lens-doc" data-testid="lens-doc" title="Doc skin for this page" role="tab">Doc</button>
    </div>
    <span class="peek-hint" id="peek-hint" hidden data-testid="soft-peek-hint"></span>
    <span class="spacer"></span>
    <button type="button" class="health" id="health" data-testid="health" title="Connection details · Nav issue lives here (or Ctrl+Shift+M)" aria-haspopup="dialog" aria-expanded="false">
      <span class="dot" aria-hidden="true"></span>
      <span class="htext">DB …</span>
    </button>
    <button type="button" class="btn" id="btn-feedback" data-testid="btn-feedback" title="Send feedback (Google Form)">Feedback</button>
    <button type="button" class="btn dbg" id="btn-devtools" data-testid="btn-devtools" title="Open Electron DevTools for the ERP pane (Inspect / Console)">ERP console</button>
    <button type="button" class="btn src" id="btn-source" data-testid="btn-source">Source code</button>
  </div>
  <script>
    const api = window.erpUi;
    const healthEl = document.getElementById("health");
    const htext = healthEl.querySelector(".htext");
    const lensVanilla = document.getElementById("lens-vanilla");
    const lensSimplified = document.getElementById("lens-simplified");
    const lensDoc = document.getElementById("lens-doc");
    const lensLabel = document.getElementById("lens-label");
    const peekHint = document.getElementById("peek-hint");
    const appVer = document.getElementById("app-ver");
    let diagnoseOpen = false;
    let softPeekActive = false;

    function setHealth(status) {
      healthEl.classList.toggle("ok", status === "ok");
      healthEl.classList.toggle("bad", status === "bad");
      htext.textContent = status === "ok" ? "DB" : status === "bad" ? "DB" : "DB …";
    }

    function applyUiState(s) {
      const showingHome = !!s.showingHome;
      const onDocForm = !!(s.showingBill || s.showingDocForm);
      const docOk = s.docSkinAvailable !== false;
      const activeLens = s.lens || "vanilla";
      softPeekActive = !!s.softPeekActive;
      lensDoc.hidden = !docOk;
      // Says what the tab will actually do: skin this page, or hop back one step.
      lensDoc.title = s.docTabHint || "Doc skin for this page";
      lensLabel.hidden = false;
      // Simplified tab visible whenever there is a doctype form in context (ERP or doc skin)
      const onErpForm = !showingHome && !onDocForm;
      const hasForm = !showingHome && (onErpForm || onDocForm);
      lensSimplified.hidden = !hasForm;
      lensDoc.classList.toggle("active", (showingHome || onDocForm) && docOk);
      lensVanilla.classList.toggle("active", onErpForm && activeLens !== "simplified");
      lensSimplified.classList.toggle("active", onDocForm ? false : onErpForm && activeLens === "simplified");
      if (peekHint) {
        const hint = softPeekActive && s.softPeekHint ? String(s.softPeekHint) : "";
        peekHint.hidden = !hint;
        peekHint.textContent = hint;
        peekHint.title = hint ? "Return to the document you were editing" : "";
      }
      if (s.diagnoseOpen != null) {
        diagnoseOpen = !!s.diagnoseOpen;
        healthEl.setAttribute("aria-expanded", diagnoseOpen ? "true" : "false");
      }
    }

    document.getElementById("btn-home").onclick = () => api && api.goHome();
    document.getElementById("btn-feedback").onclick = () => {
      if (api && api.openFeedback) api.openFeedback();
    };
    lensDoc.onclick = () => api && api.openDocSkin && api.openDocSkin();
    lensVanilla.onclick = () => api && api.openVanillaSkin && api.openVanillaSkin();
    lensSimplified.onclick = () => api && api.openSimplifiedSkin && api.openSimplifiedSkin();
    healthEl.onclick = () => {
      if (!api) return;
      if (diagnoseOpen && api.closeDiagnose) api.closeDiagnose();
      else if (api.openDiagnose) api.openDiagnose();
    };
    document.getElementById("btn-devtools").onclick = () => api && api.openDevtools("erp");
    document.getElementById("btn-source").onclick = () => {
      api && api.getConfig().then((c) => api.openExternal(c.repo));
    };

    if (api) {
      api.onHealth(setHealth);
      api.onState((s) => applyUiState(s || {}));
      api.getConfig().then((c) => {
        if (c && c.version) {
          appVer.textContent = `v${c.version}`;
          appVer.title = c.updateStub || "Shell updates: ask IT";
        }
      });
    }

    document.addEventListener("keydown", (e) => {
      // Shortcut still works from chrome; primary entry is DB diagnose → Nav issue.
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "M" || e.key === "m")) {
        e.preventDefault();
        if (api && api.openNavIncident) api.openNavIncident();
        return;
      }
      if (e.key !== "Escape") return;
      if (diagnoseOpen && api && api.closeDiagnose) {
        api.closeDiagnose();
        return;
      }
      if (softPeekActive && api && api.dismissSoftPeek) api.dismissSoftPeek();
    });
  </script>
</body>
</html>
